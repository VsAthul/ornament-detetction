<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gold Ornament Detector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 18px; font-weight: 600; color: #1a1a1a; }
    header span { font-size: 13px; color: #888; }

    .container {
      display: flex;
      gap: 24px;
      padding: 32px;
      flex: 1;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }

    .card {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card h2 { font-size: 15px; font-weight: 600; color: #1a1a1a; }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed #d0d0d0;
      border-radius: 8px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    .upload-zone:hover { border-color: #999; background: #fafafa; }
    .upload-zone.dragover { border-color: #555; background: #f0f0f0; }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-zone p { font-size: 14px; color: #888; margin-top: 8px; }
    .upload-zone .icon { font-size: 32px; color: #bbb; }

    /* Preview */
    #preview-wrap { display: none; }

    #preview {
      width: 100%;
      border-radius: 8px;
      object-fit: contain;
      max-height: 280px;
      background: #f5f5f5;
    }

    .file-name {
      font-size: 13px;
      color: #666;
      text-align: center;
    }

    /* Button */
    button#analyze-btn {
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #1a1a1a;
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
    }

    button#analyze-btn:hover { background: #333; }
    button#analyze-btn:disabled { background: #aaa; cursor: not-allowed; }

    /* Results card */
    .results-card { flex: 1.2; }

    .status-bar {
      font-size: 13px;
      color: #888;
      min-height: 20px;
    }

    .status-bar.error { color: #c0392b; }
    .status-bar.success { color: #27ae60; }

    /* Spinner */
    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid #e0e0e0;
      border-top-color: #555;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Summary pills */
    .summary {
      display: none;
      gap: 12px;
    }

    .pill {
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 10px 16px;
      flex: 1;
      text-align: center;
    }

    .pill .pill-value { font-size: 24px; font-weight: 600; color: #1a1a1a; }
    .pill .pill-label { font-size: 12px; color: #888; margin-top: 2px; }

    /* Table */
    .table-wrap { display: none; overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    thead tr { background: #f9f9f9; }
    th { padding: 10px 16px; text-align: left; font-weight: 500;
         color: #555; border-bottom: 1px solid #e0e0e0; font-size: 13px; }
    td { padding: 12px 16px; color: #1a1a1a; border-bottom: 1px solid #f0f0f0; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fafafa; }

    .badge {
      display: inline-block;
      background: #f0f0f0;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 13px;
      color: #444;
      text-transform: capitalize;
    }

    .qty { font-weight: 600; color: #1a1a1a; }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #bbb;
      gap: 10px;
      min-height: 200px;
    }

    .empty-state .icon { font-size: 36px; }
    .empty-state p { font-size: 14px; }

    footer {
      text-align: center;
      padding: 16px;
      font-size: 12px;
      color: #bbb;
    }
  </style>
</head>
<body>

  <header>
    <h1>Incede &mdash; Gold Ornament Detector</h1>
  </header>

  <div class="container">

    <!-- Left: Upload card -->
    <div class="card">
      <h2>Upload Image</h2>

      <div class="upload-zone" id="upload-zone">
        <input type="file" id="file-input" accept="image/*">
        <div class="icon">&#128247;</div>
        <p>Click to upload or drag &amp; drop</p>
        <p>JPEG, PNG, WEBP, GIF supported</p>
      </div>

      <div id="preview-wrap">
        <img id="preview" alt="Preview">
        <p class="file-name" id="file-name"></p>
      </div>

      <button id="analyze-btn" disabled onclick="analyze()">Analyze</button>
    </div>

    <!-- Right: Results card -->
    <div class="card results-card">
      <h2>Detection Results</h2>

      <div class="status-bar" id="status">Upload an image to begin</div>
      <div class="spinner" id="spinner"></div>

      <div class="summary" id="summary" style="display:none; flex-direction:row;">
        <div class="pill">
          <div class="pill-value" id="total-types">0</div>
          <div class="pill-label">Item Types</div>
        </div>
        <div class="pill">
          <div class="pill-value" id="total-count">0</div>
          <div class="pill-label">Total Count</div>
        </div>
      </div>

      <div class="table-wrap" id="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Item Type</th>
              <th>Quantity</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
      </div>

      <div class="empty-state" id="empty-state">
        <div class="icon">&#128081;</div>
        <p>Detected ornaments will appear here</p>
      </div>
    </div>

  </div>

  <footer>
    Gold Ornament Detector &nbsp;&middot;&nbsp; Powered by <i>Ahul VS</i>
  </footer>

  <script>
    const fileInput   = document.getElementById('file-input');
    const uploadZone  = document.getElementById('upload-zone');
    const previewWrap = document.getElementById('preview-wrap');
    const preview     = document.getElementById('preview');
    const fileName    = document.getElementById('file-name');
    const analyzeBtn  = document.getElementById('analyze-btn');
    const status      = document.getElementById('status');
    const spinner     = document.getElementById('spinner');
    const summary     = document.getElementById('summary');
    const totalTypes  = document.getElementById('total-types');
    const totalCount  = document.getElementById('total-count');
    const tableWrap   = document.getElementById('table-wrap');
    const resultsBody = document.getElementById('results-body');
    const emptyState  = document.getElementById('empty-state');

    // File select via input
    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) loadPreview(fileInput.files[0]);
    });

    // Drag and drop
    uploadZone.addEventListener('dragover', e => {
      e.preventDefault();
      uploadZone.classList.add('dragover');
    });

    uploadZone.addEventListener('dragleave', () => {
      uploadZone.classList.remove('dragover');
    });

    uploadZone.addEventListener('drop', e => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) loadPreview(file);
    });

    function loadPreview(file) {
      const reader = new FileReader();
      reader.onload = ev => {
        preview.src = ev.target.result;
        previewWrap.style.display = 'block';
        fileName.textContent = file.name;
        analyzeBtn.disabled = false;
        resetResults();
        setStatus('Image ready — click Analyze', '');
      };
      reader.readAsDataURL(file);
    }

    function resetResults() {
      summary.style.display = 'none';
      tableWrap.style.display = 'none';
      emptyState.style.display = 'flex';
      resultsBody.innerHTML = '';
    }

    function setStatus(msg, type) {
      status.textContent = msg;
      status.className = 'status-bar' + (type ? ' ' + type : '');
    }

    function setLoading(on) {
      spinner.style.display = on ? 'block' : 'none';
      analyzeBtn.disabled = on;
    }

    async function analyze() {
      const file = fileInput.files[0];
      if (!file) return;

      setLoading(true);
      resetResults();
      setStatus('Analyzing image...', '');

      const form = new FormData();
      form.append('file', file);

      try {
        const res = await fetch('/analyze', { method: 'POST', body: form });
        const data = await res.json();

        if (!res.ok) {
          setStatus('Error: ' + (data.detail || 'Something went wrong'), 'error');
          return;
        }

        renderResults(data);
        setStatus(
          `Found ${data.total_types} type(s), ${data.total_count} ornament(s) total`,
          'success'
        );
      } catch (err) {
        setStatus('Network error: ' + err.message, 'error');
      } finally {
        setLoading(false);
      }
    }

    function renderResults(data) {
      // Summary pills
      totalTypes.textContent = data.total_types;
      totalCount.textContent = data.total_count;
      summary.style.display = 'flex';

      // Table
      resultsBody.innerHTML = '';

      if (data.items.length === 0) {
        emptyState.style.display = 'flex';
        return;
      }

      data.items.forEach((item, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="color:#bbb;">${i + 1}</td>
          <td><span class="badge">${item.item_type}</span></td>
          <td class="qty">${item.quantity}</td>
        `;
        resultsBody.appendChild(tr);
      });

      emptyState.style.display = 'none';
      tableWrap.style.display = 'block';
    }
  </script>

</body>
</html>
